name: Notify server deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch integrated deployment
        env:
          GH_TOKEN: ${{ secrets.SERVER_REPO_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          curl --fail-with-body --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/UOS-MrWorld/mr-world-cuty-server/dispatches \
            --data '{"event_type":"client-updated"}'
